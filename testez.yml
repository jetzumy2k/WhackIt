# Selene standard library for TestEZ spec globals. Used only for tests/ (see selene.tests.toml).
---
base: roblox
globals:
  describe:
    args:
      - type: string
      - type: function
  it:
    args:
      - type: string
      - type: function
  itSKIP:
    args:
      - type: string
      - type: function
  itFOCUS:
    args:
      - type: string
      - type: function
  beforeAll:
    args:
      - type: function
  afterAll:
    args:
      - type: function
  beforeEach:
    args:
      - type: function
  afterEach:
    args:
      - type: function
  expect:
    args:
      - type: any
